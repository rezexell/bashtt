services:
  postgres:
    image: postgres:18-alpine
    container_name: bashtt-postgres

    environment:
      POSTGRES_DB: bashtt
      POSTGRES_USER: bashtt
      POSTGRES_PASSWORD: bashtt

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U bashtt -d bashtt"
        ]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
